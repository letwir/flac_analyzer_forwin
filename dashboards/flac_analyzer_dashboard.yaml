apiVersion: dashboard.grafana.app/v2
kind: Dashboard
metadata:
  name: lefl76b
spec:
  annotations:
  - kind: AnnotationQuery
    spec:
      builtIn: true
      enable: true
      hide: true
      iconColor: rgba(0, 211, 255, 1)
      name: Annotations & Alerts
      query:
        datasource:
          name: -- Grafana --
        group: grafana
        kind: DataQuery
        spec: {}
        version: v0
  cursorSync: 'Off'
  description: FLAC Analyzer 音響解析パイプライン可観測性ダッシュボード
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_tasks_per_minute
                    format: time_series
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 1分間あたりの処理完了トラック数
        id: 1
        links: []
        title: 🎵 処理速度 (Tracks/min)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                decimals: 1
                thresholds:
                  mode: absolute
                  steps:
                  - color: red
                    value: 0
                  - color: yellow
                    value: 1
                  - color: green
                    value: 3
                  - color: super-light-green
                    value: 6
                unit: tracks/min
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-2:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_avg_task_duration_seconds
                    format: time_series
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 1トラックあたりの平均所要時間 (EMA集約)
        id: 2
        links: []
        title: ⏱️ 1曲平均所要時間
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                decimals: 1
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: yellow
                    value: 180
                  - color: orange
                    value: 300
                  - color: red
                    value: 600
                unit: s
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-3:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_eta_seconds
                    format: time_series
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: キュー全件完了までの残り推定時間
        id: 3
        links: []
        title: ⏳ 残り推定時間 (ETA)
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: continuous-GrYlRd
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                  - color: yellow
                    value: 36000
                  - color: red
                    value: 180000
                unit: s
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-4:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_queue_length
                    format: time_series
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 未処理のトラックキュー残量
        id: 4
        links: []
        title: 📋 残りキュー件数
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: blue
                    value: 0
                  - color: purple
                    value: 500
                  - color: orange
                    value: 1000
                unit: short
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-5:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_active_workers
                    format: time_series
                    legendFormat: Workers
                    range: true
                  version: v0
                refId: A
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_demucs_slots_in_use
                    format: time_series
                    legendFormat: Demucs Slot
                    range: true
                  version: v0
                refId: B
            queryOptions: {}
            transformations: []
        description: 現在アクティブなワーカープロセス数およびDemucs専有枠
        id: 5
        links: []
        title: ⚙️ 稼働ワーカー / Demucs枠
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: thresholds
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: blue
                    value: 0
                  - color: green
                    value: 1
                  - color: yellow
                    value: 8
                  - color: orange
                    value: 16
                unit: short
              overrides: []
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-6:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: sum(analyzer_tasks_total{status="success"})
                    format: time_series
                    legendFormat: 成功
                    range: true
                  version: v0
                refId: A
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: sum(analyzer_tasks_total{status="error"})
                    format: time_series
                    legendFormat: エラー
                    range: true
                  version: v0
                refId: B
            queryOptions: {}
            transformations: []
        description: 解析完了トラック総数 (成功 vs エラー)
        id: 6
        links: []
        title: ✅ 完了トラック実績
        vizConfig:
          group: stat
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                decimals: 0
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: short
              overrides:
              - matcher:
                  id: byRegexp
                  options: /エラー/
                properties:
                - id: color
                  value:
                    fixedColor: red
                    mode: fixed
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: value
              wideLayout: true
          version: 13.1.1
    panel-10:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_tasks_per_minute
                    format: time_series
                    legendFormat: 処理速度 (tracks/min)
                    range: true
                  version: v0
                refId: A
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_files_per_minute
                    format: time_series
                    legendFormat: 処理速度 (files/min)
                    range: true
                  version: v0
                refId: B
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_avg_task_duration_seconds
                    format: time_series
                    legendFormat: 1曲平均所要時間 (s)
                    range: true
                  version: v0
                refId: C
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_last_task_duration_seconds
                    format: time_series
                    legendFormat: 1曲直近所要時間 (s)
                    range: true
                  version: v0
                refId: D
            queryOptions: {}
            transformations: []
        description: スループット (左軸) および 1曲所要時間 (右軸) の時系列推移
        id: 10
        links: []
        title: 📈 処理速度 ＆ 所要時間推移 (Throughput & Latency)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: 処理数 / 分
                  axisPlacement: left
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 12
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: short
              overrides:
              - matcher:
                  id: byRegexp
                  options: /所要時間/
                properties:
                - id: custom.axisPlacement
                  value: right
                - id: custom.axisLabel
                  value: 所要時間 (秒)
                - id: unit
                  value: s
                - id: custom.lineStyle
                  value:
                    dash:
                    - 8
                    - 6
                    fill: dash
            options:
              annotations:
                clustering: -1
                multiLane: false
              legend:
                calcs:
                - lastNotNull
                - mean
                - max
                displayMode: table
                enableFacetedFilter: false
                overflow: ellipsis
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.1.1
    panel-11:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_last_stage_duration_seconds{stage=~"demucs|librosa|tensor|essentia|flac_tagger|db_ingest|hash_check|shm_alloc"}
                    format: time_series
                    legendFormat: '{{stage}} (直近)'
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: 各解析ステージごとの所要時間分解 (ボトルネックの特定)
        id: 11
        links: []
        title: 🔍 ステージ別所要時間 (Stage Latency Breakdown)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: 所要時間
                  axisPlacement: left
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 15
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: s
              overrides:
              - matcher:
                  id: byRegexp
                  options: /demucs/
                properties:
                - id: color
                  value:
                    fixedColor: '#E02F44'
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /librosa/
                properties:
                - id: color
                  value:
                    fixedColor: '#FF780A'
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /tensor/
                properties:
                - id: color
                  value:
                    fixedColor: '#56A64B'
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /essentia/
                properties:
                - id: color
                  value:
                    fixedColor: '#73BF69'
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /flac_tagger/
                properties:
                - id: color
                  value:
                    fixedColor: '#3274D9'
                    mode: fixed
              - matcher:
                  id: byRegexp
                  options: /db_ingest/
                properties:
                - id: color
                  value:
                    fixedColor: '#8AB8FF'
                    mode: fixed
            options:
              annotations:
                clustering: -1
                multiLane: false
              legend:
                calcs:
                - lastNotNull
                - mean
                - max
                displayMode: table
                enableFacetedFilter: false
                overflow: ellipsis
                placement: bottom
                showLegend: true
                sortBy: Last *
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.1.1
    panel-20:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_last_demucs_wait_seconds
                    format: time_series
                    legendFormat: Demucs 実行枠待ち時間 (s)
                    range: true
                  version: v0
                refId: A
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_demucs_queue_waiters
                    format: time_series
                    legendFormat: Demucs 待機ワーカー数 (workers)
                    range: true
                  version: v0
                refId: B
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_last_gatekeeper_wait_seconds
                    format: time_series
                    legendFormat: Gatekeeper 防御待機時間 (s)
                    range: true
                  version: v0
                refId: C
            queryOptions: {}
            transformations: []
        description: Demucs 同時実行制限に伴うセマフォ待機時間 (左軸) および待機中ワーカー数 (右軸)
        id: 20
        links: []
        title: ⏳ リソース競合 ＆ 待機時間 (Contention & Queue Wait)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: 待機時間
                  axisPlacement: left
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 15
                  gradientMode: opacity
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 2
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: auto
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: s
              overrides:
              - matcher:
                  id: byRegexp
                  options: /待機ワーカー数/
                properties:
                - id: custom.axisPlacement
                  value: right
                - id: custom.axisLabel
                  value: 待機ワーカー数
                - id: unit
                  value: workers
                - id: custom.drawStyle
                  value: bars
                - id: custom.fillOpacity
                  value: 30
            options:
              annotations:
                clustering: -1
                multiLane: false
              legend:
                calcs:
                - lastNotNull
                - mean
                - max
                displayMode: table
                enableFacetedFilter: false
                overflow: ellipsis
                placement: bottom
                showLegend: true
                sortBy: Last *
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.1.1
    panel-21:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_python_last_stage_duration_seconds
                    format: time_series
                    legendFormat: '{{component}} - {{step}}'
                    range: true
                  version: v0
                refId: A
            queryOptions: {}
            transformations: []
        description: Python サブプロセス内部のステップ別所要時間 (Warmup vs Extract vs Inference)
        id: 21
        links: []
        title: 🐍 Python 内部ステッププロファイル (Step Breakdown)
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: 所要時間
                  axisPlacement: left
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 10
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1.5
                  pointSize: 5
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
                thresholds:
                  mode: absolute
                  steps:
                  - color: green
                    value: 0
                unit: s
              overrides: []
            options:
              annotations:
                clustering: -1
                multiLane: false
              legend:
                calcs:
                - lastNotNull
                - mean
                - max
                displayMode: table
                enableFacetedFilter: false
                overflow: ellipsis
                placement: bottom
                showLegend: true
                sortBy: Last *
                sortDesc: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
          version: 13.1.1
    panel-30:
      kind: Panel
      spec:
        data:
          kind: QueryGroup
          spec:
            queries:
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_ram_available_bytes
                    format: time_series
                    legendFormat: システム空き RAM
                    range: true
                  version: v0
                refId: A
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: process_resident_memory_bytes
                    format: time_series
                    legendFormat: Orchestrator 常駐メモリ (RSS)
                    range: true
                  version: v0
                refId: B
            - kind: PanelQuery
              spec:
                hidden: false
                query:
                  datasource:
                    name: ${db_victoriametrics}
                  group: victoriametrics-metrics-datasource
                  kind: DataQuery
                  spec:
                    editorMode: code
                    expr: analyzer_disk_free_bytes
                    format: time_series
                    legendFormat: 作業ディスク空き容量
                    range: true
                  version: v0
                refId: C
            queryOptions: {}
            transformations: []
        description: 物理RAM・ディスク空き容量およびプロセスメモリ推移
        id: 30
        links: []
        title: 💾 システムメモリ ＆ ディスク容量
        vizConfig:
          group: timeseries
          kind: VizConfig
          spec:
            fieldConfig:
              defaults:
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
