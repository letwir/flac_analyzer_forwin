[database]
url = "postgres://postgres:postgres@localhost:5432/flac_analyzer_test"

[orchestrator]
num_workers = 4
demucs_concurrent_limit = 1
demucs_daemon_capacity = 2
demucs_dual_gpu_util_threshold = 0.50
demucs_dual_min_vram_gb = 4.0
enable_gpu_throttle = true
max_gpu_utilization_ratio = 0.85
min_avail_vram_gb = 0.5
estimated_demucs_vram_gb = 1.0
shm_allocation_delay_sec = 2
enable_disk_mode_fallback = true
disk_mode_ram_threshold_ratio = 0.8
queue_dir = "../testFLAC"
test_flac_dir = "../testFLAC"

[python_env]
omp_num_threads = "1"
openblas_num_threads = "1"
mkl_num_threads = "1"
numexpr_num_threads = "1"
veclib_maximum_threads = "1"
hf_hub_offline = "1"
pythonutf8 = "1"
pythonioencoding = "utf-8"

[models]
intra_op_num_threads = 1
inter_op_num_threads = 1
patch_size = 128
patch_hop = 62
n_fft = 512
hop_length = 256
n_mels = 96
sr = 44100
resample_sr = 16000
